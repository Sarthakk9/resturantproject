{% extends 'frontend/base.html' %}

{% block content %}
<section class="reservation-success-section">
    <div class="container text-center">
        <div class="success-card">
            <div class="success-icon">
                <i class="fa fa-check-circle" aria-hidden="true"></i>
            </div>
            <h1 class="success-title">Reservation Confirmed!</h1>
            <p class="success-text">Thank you for booking with us! We will confirm your table shortly. We look forward to welcoming you!</p>
            <a href="/" class="success-btn">Back to Home</a>
        </div>
    </div>
</section>

<style>
.reservation-success-section {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff; /* keeps navbar untouched */
    padding: 100px 15px 50px 15px; /* top padding separates navbar */
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

.success-card {
    background: #fff;
    border: 3px solid #dc3545; /* red border */
    border-radius: 20px;
    padding: 50px 30px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 15px 40px rgba(220, 53, 69, 0.3);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.success-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 50px rgba(220, 53, 69, 0.4);
}

.success-icon {
    font-size: 70px;
    color: #dc3545;
    margin-bottom: 20px;
}

.success-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #dc3545;
}

.success-text {
    font-size: 18px;
    color: #555;
    margin-bottom: 30px;
    line-height: 1.6;
}

.success-btn {
    padding: 15px 35px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 50px;
    text-decoration: none;
    color: #fff;
    background-color: #dc3545;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(220, 53, 69, 0.2);
}

.success-btn:hover {
    background-color: #b02a37;
    box-shadow: 0 12px 25px rgba(220, 53, 69, 0.3);
    transform: translateY(-3px);
}
</style>
{% endblock %}
